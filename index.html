<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizard of the Spaghetti Dungeon — Multitrack Mixer</title>
<style>
  :root{
    --bg:#100b08;--panel:#21150f;--panel2:#2d1d14;--gold:#f0bd55;
    --cream:#fff1cf;--red:#a93d2d;--green:#4f7f50;--muted:#bba98c;
    --line:#563a27;--shadow:0 16px 45px #0008;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(circle at 50% -10%,#573416 0,transparent 38%),
      linear-gradient(#160e09,#090605);
    min-height:100vh
  }
  button,input{font:inherit}
  header{
    padding:22px clamp(16px,4vw,48px);display:flex;gap:20px;align-items:center;
    border-bottom:1px solid var(--line);background:#120c08dd;position:sticky;top:0;z-index:5;
    backdrop-filter:blur(12px)
  }
  .cover{width:76px;height:76px;object-fit:cover;border-radius:14px;border:1px solid #f0bd5577;box-shadow:var(--shadow)}
  h1{font-family:Georgia,serif;font-size:clamp(1.35rem,3vw,2.2rem);margin:0;color:var(--gold)}
  .subtitle{color:var(--muted);margin-top:4px;font-size:.92rem}
  main{max-width:1500px;margin:auto;padding:22px}
  .transport,.master,.status{
    background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow)
  }
  .transport{padding:16px;display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:center}
  .btn{
    border:1px solid #7b5635;color:var(--cream);background:#3b281b;padding:10px 14px;border-radius:10px;
    cursor:pointer;transition:.15s
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold)}
  .btn.primary{background:var(--green);font-weight:700}
  .btn.danger{background:var(--red)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  #seek{width:100%;accent-color:var(--gold)}
  .time{font-variant-numeric:tabular-nums;color:var(--gold);min-width:110px;text-align:right}
  .master{margin:14px 0;padding:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .master label{display:flex;align-items:center;gap:8px}
  .master input[type=range]{accent-color:var(--gold)}
  .meter{height:12px;min-width:180px;flex:1;background:#0a0705;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .meter > div{height:100%;width:0;background:linear-gradient(90deg,#4d9d55,#e5c743,#d54031);transition:width .06s}
  .status{padding:12px 16px;margin-bottom:14px;color:var(--muted)}
  .status strong{color:var(--cream)}
  .channels{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;align-items:stretch
  }
  .channel{
    background:linear-gradient(180deg,#2b1d14,#17100c);border:1px solid var(--line);border-radius:14px;
    padding:13px;min-height:420px;display:flex;flex-direction:column;gap:12px
  }
  .channel h2{font-family:Georgia,serif;font-size:1.05rem;color:var(--gold);margin:0;text-align:center;min-height:42px}
  .row{display:flex;justify-content:center;gap:7px}
  .small{padding:7px 9px;font-size:.8rem;min-width:46px}
  .mute.active{background:#be752f}.solo.active{background:#d0bd35;color:#201600}
  .knob-label,.fader-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
  .pan,.send{width:100%;accent-color:var(--gold)}
  .fader-wrap{flex:1;display:flex;justify-content:center;align-items:center;min-height:165px}
  .fader{
    appearance:none;-webkit-appearance:none;width:155px;height:8px;transform:rotate(-90deg);
    background:#090605;border-radius:99px;accent-color:var(--gold)
  }
  .value{text-align:center;font-variant-numeric:tabular-nums;color:var(--cream);font-size:.85rem}
  .loadbar{height:5px;background:#0a0705;border-radius:99px;overflow:hidden}
  .loadbar div{height:100%;width:0;background:var(--gold)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px 10px}
  @media(max-width:720px){
    header{position:static}.transport{grid-template-columns:repeat(3,1fr)}
    .transport #seek{grid-column:1/-1}.time{grid-column:1/-1;text-align:center}
    .channels{grid-template-columns:repeat(2,minmax(145px,1fr))}
  }
</style>
</head>
<body>
<header>
  <img class="cover" src="https://raw.githubusercontent.com/Librarium-Games/Wizard-of-the-Spaghetti-Dungeon/main/Wizard%20of%20the%20Spaghetti%20Dungeon.png" alt="Song cover">
  <div>
    <h1>Wizard of the Spaghetti Dungeon</h1>
    <div class="subtitle">12-stem Web Audio multitrack mixer • Jeremy Anderson / ChatGPT / SUNO</div>
  </div>
</header>

<main>
  <section class="transport">
    <button id="loadBtn" class="btn primary">Load stems</button>
    <button id="playBtn" class="btn" disabled>▶ Play</button>
    <button id="stopBtn" class="btn danger" disabled>■ Stop</button>
    <input id="seek" type="range" min="0" max="1000" value="0" disabled aria-label="Song position">
    <div id="time" class="time">0:00 / 0:00</div>
  </section>

  <section class="master">
    <label>Master <input id="masterVolume" type="range" min="0" max="1.2" step=".01" value=".85"></label>
    <label>Reverb <input id="reverbAmount" type="range" min="0" max=".8" step=".01" value=".12"></label>
    <button id="resetBtn" class="btn">Reset mix</button>
    <div class="meter" title="Master output level"><div id="meterFill"></div></div>
  </section>

  <div id="status" class="status"><strong>Ready.</strong> Press “Load stems” once, then mix the song.</div>
  <section id="channels" class="channels"></section>
</main>

<footer>
  Audio streams from the public GitHub repository. Headphones recommended. Modern Chrome, Edge, Firefox, or Safari required.
</footer>

<script>
(() => {
  'use strict';

  const base = 'https://raw.githubusercontent.com/Librarium-Games/Wizard-of-the-Spaghetti-Dungeon/main/tracks/';
  const stems = [
    ['Vocals','Wizard of the Spaghetti Dungeon (Vocals).mp3'],
    ['Backing Vocals','Wizard of the Spaghetti Dungeon (Backing Vocals).mp3'],
    ['Drums','Wizard of the Spaghetti Dungeon (Drums).mp3'],
    ['Percussion','Wizard of the Spaghetti Dungeon (Percussion).mp3'],
    ['Bass','Wizard of the Spaghetti Dungeon (Bass).mp3'],
    ['Guitar','Wizard of the Spaghetti Dungeon (Guitar).mp3'],
    ['Keyboard','Wizard of the Spaghetti Dungeon (Keyboard).mp3'],
    ['Strings','Wizard of the Spaghetti Dungeon (Strings).mp3'],
    ['Brass','Wizard of the Spaghetti Dungeon (Brass).mp3'],
    ['Woodwinds','Wizard of the Spaghetti Dungeon (Woodwinds).mp3'],
    ['Synth','Wizard of the Spaghetti Dungeon (Synth).mp3'],
    ['FX','Wizard of the Spaghetti Dungeon (FX).mp3']
  ];

  const $ = s => document.querySelector(s);
  const channelsEl = $('#channels');
  let ctx, masterGain, analyser, convolver, reverbGain, dryBus;
  let channels = [], loaded = false, playing = false;
  let duration = 0, startTime = 0, pausedAt = 0, raf = 0;

  function esc(s){ return encodeURIComponent(s).replace(/'/g,'%27'); }
  function fmt(t){
    if (!Number.isFinite(t)) t=0;
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }
  function db(v){ return v <= 0.0001 ? '-∞ dB' : `${(20*Math.log10(v)).toFixed(1)} dB`; }

  function buildUI(){
    stems.forEach(([name],i)=>{
      const el=document.createElement('article');
      el.className='channel';
      el.innerHTML=`
        <h2>${name}</h2>
        <div class="loadbar"><div></div></div>
        <div class="row">
          <button class="btn small mute">Mute</button>
          <button class="btn small solo">Solo</button>
        </div>
        <div class="knob-label">Pan</div>
        <input class="pan" type="range" min="-1" max="1" step=".01" value="0">
        <div class="value panValue">Center</div>
        <div class="knob-label">Reverb Send</div>
        <input class="send" type="range" min="0" max=".8" step=".01" value=".10">
        <div class="fader-wrap"><input class="fader" type="range" min="0" max="1.25" step=".01" value=".80"></div>
        <div class="fader-label">Volume</div>
        <div class="value volValue">${db(.8)}</div>`;
      channelsEl.appendChild(el);

      const ch={name,el,buffer:null,source:null,muted:false,solo:false,
        volume:.8, gain:null, panNode:null, sendGain:null};
      channels.push(ch);

      el.querySelector('.mute').onclick=()=>{
        ch.muted=!ch.muted; el.querySelector('.mute').classList.toggle('active',ch.muted); applyMix();
      };
      el.querySelector('.solo').onclick=()=>{
        ch.solo=!ch.solo; el.querySelector('.solo').classList.toggle('active',ch.solo); applyMix();
      };
      el.querySelector('.fader').oninput=e=>{
        ch.volume=+e.target.value; el.querySelector('.volValue').textContent=db(ch.volume); applyMix();
      };
      el.querySelector('.pan').oninput=e=>{
        const v=+e.target.value; if(ch.panNode) ch.panNode.pan.value=v;
        el.querySelector('.panValue').textContent=v===0?'Center':`${Math.round(Math.abs(v)*100)}% ${v<0?'L':'R'}`;
      };
      el.querySelector('.send').oninput=e=>{ if(ch.sendGain) ch.sendGain.gain.value=+e.target.value; };
    });
  }

  function createImpulse(seconds=2.2, decay=2.7){
    const rate=ctx.sampleRate, length=rate*seconds, impulse=ctx.createBuffer(2,length,rate);
    for(let c=0;c<2;c++){
      const d=impulse.getChannelData(c);
      for(let i=0;i<length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay);
    }
    return impulse;
  }

  async function initAudio(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain=ctx.createGain();
    dryBus=ctx.createGain();
    analyser=ctx.createAnalyser(); analyser.fftSize=256;
    convolver=ctx.createConvolver(); convolver.buffer=createImpulse();
    reverbGain=ctx.createGain(); reverbGain.gain.value=+$('#reverbAmount').value;

    dryBus.connect(masterGain);
    convolver.connect(reverbGain).connect(masterGain);
    masterGain.connect(analyser).connect(ctx.destination);
    masterGain.gain.value=+$('#masterVolume').value;

    channels.forEach(ch=>{
      ch.gain=ctx.createGain();
      ch.panNode=ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
      ch.sendGain=ctx.createGain();
      ch.gain.connect(ch.panNode);
      ch.panNode.connect(dryBus);
      ch.panNode.connect(ch.sendGain).connect(convolver);
      ch.sendGain.gain.value=.10;
    });
  }

  async function fetchStem(ch,filename,index){
    const url=base+esc(filename);
    const response=await fetch(url);
    if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const total=+(response.headers.get('content-length')||0);
    const bar=ch.el.querySelector('.loadbar div');
    let arrayBuffer;
    if(response.body && total){
      const reader=response.body.getReader(), chunks=[]; let received=0;
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        chunks.push(value); received+=value.length;
        bar.style.width=`${received/total*100}%`;
      }
      const merged=new Uint8Array(received); let pos=0;
      chunks.forEach(x=>{merged.set(x,pos);pos+=x.length}); arrayBuffer=merged.buffer;
    } else {
      arrayBuffer=await response.arrayBuffer(); bar.style.width='100%';
    }
    ch.buffer=await ctx.decodeAudioData(arrayBuffer.slice(0));
    duration=Math.max(duration,ch.buffer.duration);
    $('#status').innerHTML=`<strong>Loading ${index+1}/${stems.length}:</strong> ${ch.name}`;
  }

  async function loadAll(){
    $('#loadBtn').disabled=true;
    $('#status').innerHTML='<strong>Initializing audio…</strong>';
    try{
      await initAudio();
      for(let i=0;i<stems.length;i++) await fetchStem(channels[i],stems[i][1],i);
      loaded=true;
      $('#playBtn').disabled=false; $('#stopBtn').disabled=false; $('#seek').disabled=false;
      $('#status').innerHTML=`<strong>All ${stems.length} stems loaded.</strong> Press Play and shape your mix.`;
      $('#time').textContent=`0:00 / ${fmt(duration)}`;
    }catch(err){
      console.error(err);
      $('#status').innerHTML=`<strong>Could not load the stems.</strong> ${err.message}. Try serving this HTML from GitHub Pages or a local web server.`;
      $('#loadBtn').disabled=false;
    }
  }

  function applyMix(){
    const anySolo=channels.some(c=>c.solo);
    channels.forEach(ch=>{
      if(!ch.gain) return;
      const audible=!ch.muted && (!anySolo || ch.solo);
      ch.gain.gain.setTargetAtTime(audible?ch.volume:0,ctx.currentTime,.015);
    });
  }

  function makeSources(offset){
    channels.forEach(ch=>{
      const src=ctx.createBufferSource();
      src.buffer=ch.buffer; src.connect(ch.gain);
      src.onended=()=>{};
      ch.source=src;
      src.start(0,Math.min(offset,ch.buffer.duration-.01));
    });
    applyMix();
  }

  async function play(){
    if(!loaded)return;
    await ctx.resume();
    if(playing){ pause(); return; }
    if(pausedAt>=duration-.02) pausedAt=0;
    makeSources(pausedAt);
    startTime=ctx.currentTime-pausedAt;
    playing=true; $('#playBtn').textContent='❚❚ Pause';
    tick();
  }

  function pause(){
    if(!playing)return;
    pausedAt=Math.min(duration,ctx.currentTime-startTime);
    stopSources(); playing=false; $('#playBtn').textContent='▶ Play';
    cancelAnimationFrame(raf); updatePosition();
  }

  function stopSources(){
    channels.forEach(ch=>{ if(ch.source){ try{ch.source.stop()}catch(e){} ch.source.disconnect(); ch.source=null; }});
  }

  function stop(){
    stopSources(); playing=false; pausedAt=0; $('#playBtn').textContent='▶ Play';
    cancelAnimationFrame(raf); updatePosition();
  }

  function seekTo(value){
    const wasPlaying=playing;
    if(wasPlaying) stopSources();
    pausedAt=(value/1000)*duration;
    if(wasPlaying){ makeSources(pausedAt); startTime=ctx.currentTime-pausedAt; }
    updatePosition();
  }

  function updatePosition(){
    const current=playing ? Math.min(duration,ctx.currentTime-startTime) : pausedAt;
    $('#seek').value=duration ? current/duration*1000 : 0;
    $('#time').textContent=`${fmt(current)} / ${fmt(duration)}`;
    if(playing && current>=duration-.03) stop();
  }

  function tick(){
    updatePosition();
    const data=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
    const avg=data.reduce((a,b)=>a+b,0)/data.length;
    $('#meterFill').style.width=`${Math.min(100,avg/180*100)}%`;
    if(playing) raf=requestAnimationFrame(tick);
  }

  function resetMix(){
    channels.forEach(ch=>{
      ch.muted=false;ch.solo=false;ch.volume=.8;
      ch.el.querySelector('.mute').classList.remove('active');
      ch.el.querySelector('.solo').classList.remove('active');
      ch.el.querySelector('.fader').value=.8;
      ch.el.querySelector('.volValue').textContent=db(.8);
      ch.el.querySelector('.pan').value=0;
      ch.el.querySelector('.panValue').textContent='Center';
      ch.el.querySelector('.send').value=.10;
      if(ch.panNode?.pan)ch.panNode.pan.value=0;
      if(ch.sendGain)ch.sendGain.gain.value=.10;
    });
    $('#masterVolume').value=.85; $('#reverbAmount').value=.12;
    if(masterGain)masterGain.gain.value=.85;if(reverbGain)reverbGain.gain.value=.12;
    applyMix();
  }

  $('#loadBtn').onclick=loadAll;
  $('#playBtn').onclick=play;
  $('#stopBtn').onclick=stop;
  $('#seek').oninput=e=>seekTo(+e.target.value);
  $('#masterVolume').oninput=e=>{if(masterGain)masterGain.gain.value=+e.target.value};
  $('#reverbAmount').oninput=e=>{if(reverbGain)reverbGain.gain.value=+e.target.value};
  $('#resetBtn').onclick=resetMix;
  document.addEventListener('keydown',e=>{
    if(e.code==='Space' && !/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();play();}
  });

  buildUI();
})();
</script>
</body>
</html>
